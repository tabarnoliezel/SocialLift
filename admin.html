<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SocialLift Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      border: 1px solid #e4e7ec;
      box-shadow: 0 20px 50px rgba(16, 24, 40, 0.10);
    }

    .login-logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .login-logo span {
      color: #111827;
    }

    .login-subtitle {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
    }

    .login-button {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fef3f2;
      color: #b42318;
      text-align: center;
      font-size: 13px;
    }

    /* DASHBOARD */

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
    }

    .logo span {
      color: #60a5fa;
    }

    .admin-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .admin-label {
      font-size: 13px;
      color: #cbd5e1;
    }

    .logout-button {
      border: 1px solid #475467;
      background: transparent;
      color: white;
      padding: 8px 13px;
      border-radius: 7px;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-card small {
      display: block;
      color: #667085;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 28px;
    }

    .orders-card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 14px;
      overflow: hidden;
    }

    .orders-header {
      padding: 20px;
      border-bottom: 1px solid #e4e7ec;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refresh-button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #edf0f4;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #475467;
    }

    .status-select {
      padding: 7px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      background: white;
    }

    .price {
      font-weight: 700;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #667085;
    }

    .error {
      padding: 20px;
      margin-bottom: 20px;
      background: #fef3f2;
      color: #b42318;
      border-radius: 10px;
      display: none;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .admin-label {
        display: none;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN SCREEN -->

<div id="loginScreen">

  <div class="login-card">

    <div class="login-logo">
      Social<span>Lift</span>
    </div>

    <div class="login-subtitle">
      Administrator Login
    </div>

    <form id="loginForm">

      <div class="form-group">

        <label for="loginEmail">
          Email Address
        </label>

        <input
          type="email"
          id="loginEmail"
          required
          autocomplete="username"
          placeholder="Admin email"
        >

      </div>


      <div class="form-group">

        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          required
          autocomplete="current-password"
          placeholder="Admin password"
        >

      </div>


      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Sign In
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </form>

  </div>

</div>


<!-- ADMIN DASHBOARD -->

<div id="dashboard" class="hidden">

  <header>

    <div class="header-inner">

      <div class="logo">
        Social<span>Lift</span>
      </div>

      <div class="admin-area">

        <div
          id="adminEmail"
          class="admin-label"
        >
          Admin
        </div>

        <button
          class="logout-button"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </div>

  </header>


  <main>

    <h1>Order Dashboard</h1>

    <p class="subtitle">
      Manage SocialLift customer orders.
    </p>


    <div
      id="errorMessage"
      class="error"
    ></div>


  <div class="stat-card">
  <small>Total Revenue</small>
  <strong id="totalRevenue">₱0.00</strong>
</div>

<div class="stat-card">
  <small>Completed Revenue</small>
  <strong id="completedRevenue">₱0.00</strong>
</div>

<div class="stat-card">
  <small>Pending Revenue</small>
  <strong id="pendingRevenue">₱0.00</strong>
</div>
      <div class="stat-card">
        <small>Pending</small>
        <strong id="pendingOrders">0</strong>
      </div>

      <div class="stat-card">
        <small>Processing</small>
        <strong id="processingOrders">0</strong>
      </div>

      <div class="stat-card">
        <small>Completed</small>
        <strong id="completedOrders">0</strong>
      </div>

    </div>


    <div class="orders-card">

      <div class="orders-header">

        <h2>Customer Orders</h2>

        <button
          class="refresh-button"
          onclick="loadOrders()"
        >
          Refresh
        </button>

      </div>


      <div class="table-container">

        <table>

          <thead>

            <tr>
              <th>Customer</th>
              <th>Platform</th>
              <th>Service</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Status</th>
              <th>Date</th>
            </tr>

          </thead>

          <tbody id="ordersTable">

            <tr>
              <td colspan="7" class="empty">
                Loading orders...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>

</div>


<script>

const SUPABASE_URL =
  "https://fcvrankhyfrvsmyxdqig.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dJ1EqqFG4eqlF1xuiDlPtA_RJz-He2D";


const loginScreen =
  document.getElementById("loginScreen");

const dashboard =
  document.getElementById("dashboard");


async function checkSession() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/user`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            `Bearer ${localStorage.getItem("sociallift_access_token") || SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      showLogin();
      return;
    }

    const user = await response.json();

    if (!user || !user.id) {
      showLogin();
      return;
    }

    showDashboard(user);

  } catch (error) {

    console.error(error);
    showLogin();

  }

}


document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const button =
      document.getElementById("loginButton");

    const error =
      document.getElementById("loginError");


    button.disabled = true;
    button.textContent = "Signing In...";

    error.style.display = "none";


    try {

      const response = await fetch(
        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


      const data = await response.json();


      if (!response.ok) {
        throw new Error(
          data.error_description ||
          data.msg ||
          "Invalid email or password."
        );
      }


      localStorage.setItem(
        "sociallift_access_token",
        data.access_token
      );


      showDashboard(data.user);


    } catch (err) {

      error.textContent =
        err.message || "Unable to sign in.";

      error.style.display = "block";


    } finally {

      button.disabled = false;
      button.textContent = "Sign In";

    }

  });


function showLogin() {

  loginScreen.classList.remove("hidden");
  dashboard.classList.add("hidden");

}


function showDashboard(user) {

  loginScreen.classList.add("hidden");
  dashboard.classList.remove("hidden");

  document.getElementById("adminEmail").textContent =
    user.email || "Admin";

  loadOrders();

}


async function loadOrders() {

  const token =
    localStorage.getItem("sociallift_access_token");

  const table =
    document.getElementById("ordersTable");

  const errorMessage =
    document.getElementById("errorMessage");


  if (!token) {

    showLogin();
    return;

  }


  errorMessage.style.display = "none";


  table.innerHTML = `
    <tr>
      <td colspan="7" class="empty">
        Loading orders...
      </td>
    </tr>
  `;


  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/smm_orders?select=*&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`
        }
      }
    );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(errorText);

    }


    const orders =
      await response.json();


    updateStats(orders);


    if (!orders.length) {

      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            No orders found.
          </td>
        </tr>
      `;

      return;

    }


    table.innerHTML =
      orders.map(order => `

      <tr>

        <td>
          <strong>
            ${escapeHtml(order.customer_name || "")}
          </strong>
          <br>
          ${escapeHtml(order.customer_email || "")}
        </td>

        <td>
          ${escapeHtml(order.platform || "")}
        </td>

        <td>
          ${escapeHtml(order.service || "")}
        </td>

        <td>
          ${Number(order.quantity || 0).toLocaleString()}
        </td>

        <td class="price">
          ₱${Number(order.estimated_price || 0)
            .toLocaleString("en-PH", {
              minimumFractionDigits: 2
            })}
        </td>

        <td>

          <select
            class="status-select"
            onchange="updateStatus('${order.id}', this.value)"
          >

            <option
              value="Pending"
              ${order.order_status === "Pending" ? "selected" : ""}
            >
              Pending
            </option>

            <option
              value="Processing"
              ${order.order_status === "Processing" ? "selected" : ""}
            >
              Processing
            </option>

            <option
              value="Completed"
              ${order.order_status === "Completed" ? "selected" : ""}
            >
              Completed
            </option>

            <option
              value="Cancelled"
              ${order.order_status === "Cancelled" ? "selected" : ""}
            >
              Cancelled
            </option>

          </select>

        </td>

        <td>
          ${formatDate(order.created_at)}
        </td>

      </tr>

    `).join("");


  } catch (error) {

    console.error(error);

    table.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Unable to load orders.
        </td>
      </tr>
    `;

    errorMessage.textContent =
      "Unable to load orders. Make sure your Supabase policies allow authenticated admins to read orders.";

    errorMessage.style.display = "block";

  }

}


function updateStats(orders) {

  document.getElementById("totalOrders").textContent =
    orders.length;

  document.getElementById("pendingOrders").textContent =
    orders.filter(
      order => order.order_status === "Pending"
    ).length;

  document.getElementById("processingOrders").textContent =
    orders.filter(
      order => order.order_status === "Processing"
    ).length;

  document.getElementById("completedOrders").textContent =
    orders.filter(
      order => order.order_status === "Completed"
    ).length;

}

  const totalRevenue = orders.reduce(
    (sum, order) =>
      sum + Number(order.estimated_price || 0),
    0
  );

  const completedRevenue = orders
    .filter(order => order.order_status === "Completed")
    .reduce(
      (sum, order) =>
        sum + Number(order.estimated_price || 0),
      0
    );

  const pendingRevenue = orders
    .filter(order => order.order_status === "Pending")
    .reduce(
      (sum, order) =>
        sum + Number(order.estimated_price || 0),
      0
    );

  document.getElementById("totalRevenue").textContent =
    "₱" + totalRevenue.toLocaleString("en-PH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  document.getElementById("completedRevenue").textContent =
    "₱" + completedRevenue.toLocaleString("en-PH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  document.getElementById("pendingRevenue").textContent =
    "₱" + pendingRevenue.toLocaleString("en-PH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  
async function updateStatus(id, status) {

  const token =
    localStorage.getItem("sociallift_access_token");


  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/smm_orders?id=eq.${id}`,
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`,
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          order_status: status
        })

      }
    );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(errorText);

    }


    loadOrders();


  } catch (error) {

    console.error(error);

    alert(
      "Unable to update order status. Check your Supabase policies."
    );

  }

}


async function logout() {

  const token =
    localStorage.getItem("sociallift_access_token");


  try {

    if (token) {

      await fetch(
        `${SUPABASE_URL}/auth/v1/logout`,
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${token}`
          }
        }
      );

    }

  } catch (error) {

    console.error(error);

  }


  localStorage.removeItem(
    "sociallift_access_token"
  );

  showLogin();

}


function formatDate(date) {

  if (!date) return "";

  return new Date(date).toLocaleString("en-PH");

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


checkSession();

</script>

</body>
</html>
