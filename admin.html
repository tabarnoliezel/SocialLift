
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SocialLift Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
    }

    .logo span {
      color: #60a5fa;
    }

    .admin-label {
      font-size: 13px;
      color: #cbd5e1;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-card small {
      display: block;
      color: #667085;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 28px;
    }

    .orders-card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 14px;
      overflow: hidden;
    }

    .orders-header {
      padding: 20px;
      border-bottom: 1px solid #e4e7ec;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refresh-button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #edf0f4;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #475467;
    }

    .status-select {
      padding: 7px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      background: white;
    }

    .price {
      font-weight: 700;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #667085;
    }

    .error {
      padding: 20px;
      margin-bottom: 20px;
      background: #fef3f2;
      color: #b42318;
      border-radius: 10px;
      display: none;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">
      Social<span>Lift</span>
    </div>

    <div class="admin-label">
      Admin Dashboard
    </div>
  </div>
</header>


<main>

  <h1>Order Dashboard</h1>

  <p class="subtitle">
    Manage SocialLift customer orders.
  </p>


  <div id="errorMessage" class="error"></div>


  <div class="stats">

    <div class="stat-card">
      <small>Total Orders</small>
      <strong id="totalOrders">0</strong>
    </div>

    <div class="stat-card">
      <small>Pending</small>
      <strong id="pendingOrders">0</strong>
    </div>

    <div class="stat-card">
      <small>Processing</small>
      <strong id="processingOrders">0</strong>
    </div>

    <div class="stat-card">
      <small>Completed</small>
      <strong id="completedOrders">0</strong>
    </div>

  </div>


  <div class="orders-card">

    <div class="orders-header">

      <h2>Customer Orders</h2>

      <button
        class="refresh-button"
        onclick="loadOrders()"
      >
        Refresh
      </button>

    </div>


    <div class="table-container">

      <table>

        <thead>

          <tr>
            <th>Customer</th>
            <th>Platform</th>
            <th>Service</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Status</th>
            <th>Date</th>
          </tr>

        </thead>

        <tbody id="ordersTable">

          <tr>
            <td colspan="7" class="empty">
              Loading orders...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://fcvrankhyfrvsmyxdqig.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dJ1EqqFG4eqlF1xuiDlPtA_RJz-He2D";


async function loadOrders() {

  const table = document.getElementById("ordersTable");
  const errorMessage = document.getElementById("errorMessage");

  errorMessage.style.display = "none";

  table.innerHTML = `
    <tr>
      <td colspan="7" class="empty">
        Loading orders...
      </td>
    </tr>
  `;

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/smm_orders?select=*&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );


    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(errorText);

    }


    const orders = await response.json();


    updateStats(orders);


    if (!orders.length) {

      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            No orders found.
          </td>
        </tr>
      `;

      return;

    }


    table.innerHTML = orders.map(order => `

      <tr>

        <td>
          <strong>${escapeHtml(order.customer_name || "")}</strong><br>
          ${escapeHtml(order.customer_email || "")}
        </td>

        <td>
          ${escapeHtml(order.platform || "")}
        </td>

        <td>
          ${escapeHtml(order.service || "")}
        </td>

        <td>
          ${Number(order.quantity || 0).toLocaleString()}
        </td>

        <td class="price">
          ₱${Number(order.estimated_price || 0).toLocaleString("en-PH", {
            minimumFractionDigits: 2
          })}
        </td>

        <td>

          <select
            class="status-select"
            onchange="updateStatus('${order.id}', this.value)"
          >

            <option value="Pending" ${order.order_status === "Pending" ? "selected" : ""}>
              Pending
            </option>

            <option value="Processing" ${order.order_status === "Processing" ? "selected" : ""}>
              Processing
            </option>

            <option value="Completed" ${order.order_status === "Completed" ? "selected" : ""}>
              Completed
            </option>

            <option value="Cancelled" ${order.order_status === "Cancelled" ? "selected" : ""}>
              Cancelled
            </option>

          </select>

        </td>

        <td>
          ${formatDate(order.created_at)}
        </td>

      </tr>

    `).join("");


  } catch (error) {

    console.error(error);

    table.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Unable to load orders.
        </td>
      </tr>
    `;

    errorMessage.textContent =
      "Unable to load orders from Supabase.";

    errorMessage.style.display = "block";

  }

}


function updateStats(orders) {

  document.getElementById("totalOrders").textContent =
    orders.length;

  document.getElementById("pendingOrders").textContent =
    orders.filter(order => order.order_status === "Pending").length;

  document.getElementById("processingOrders").textContent =
    orders.filter(order => order.order_status === "Processing").length;

  document.getElementById("completedOrders").textContent =
    orders.filter(order => order.order_status === "Completed").length;

}


async function updateStatus(id, status) {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/smm_orders?id=eq.${id}`,
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          order_status: status
        })

      }
    );


    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(errorText);

    }


    loadOrders();


  } catch (error) {

    console.error(error);

    alert("Unable to update order status.");

  }

}


function formatDate(date) {

  if (!date) return "";

  return new Date(date).toLocaleString("en-PH");

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


loadOrders();

</script>

</body>
</html>
